name: Publish NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [created]

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack all packages
        run: |
          dotnet pack StrongTypedCache.Abstractions/StrongTypedCache.Abstractions.csproj -c Release -o out /p:ContinuousIntegrationBuild=true
          dotnet pack StrongTypedCacheLibrary/StrongTypedCacheLibrary.csproj -c Release -o out /p:ContinuousIntegrationBuild=true
          dotnet pack StrongTypedCache.Extensions/StrongTypedCache.Extensions.csproj -c Release -o out /p:ContinuousIntegrationBuild=true

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push out/*.nupkg \
            -k "$NUGET_API_KEY" \
            -s https://api.nuget.org/v3/index.json \
            --skip-duplicate

  benchmark-on-release:
    runs-on: ubuntu-latest
    needs: pack-and-publish
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Release Benchmarks
        run: |
          cd StrongTypedCache.Benchmarks
          dotnet run -c Release -- --exporters json markdown html

      - name: Upload Release Benchmark Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-benchmark-results-${{ github.ref_name }}
          path: StrongTypedCache.Benchmarks/BenchmarkDotNet.Artifacts/results/
          retention-days: 90
